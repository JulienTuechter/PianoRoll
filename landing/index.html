<!doctype html>
<!--
  Gemeinsames Template der Landingpage für alle Sprachen. Keine Texte hier: Title, Meta, hreflang,
  Open Graph und JSON-LD (Marker page-head) sowie der vorgerenderte Inhalt (Marker page-body) kommen
  aus src/i18n/{en,de}.json, eingesetzt von scripts/build-pages.ts (Build) bzw. dem Dev-Server.
-->
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--page-head-->
    <meta name="theme-color" content="#0b0605" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Quellcode (Open Source), Adresse aus .env: VITE_GITHUB_URL -->
    <link rel="code-repository" href="%VITE_GITHUB_URL%" />
    <style>
      html {
        background: #0b0605;
      }
    </style>
  </head>
  <body>
    <div id="root"><!--page-body--></div>
    <script type="module" src="/landing/src/main.tsx"></script>
  </body>
</html>
